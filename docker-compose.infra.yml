# CrimeLink — host-accessible development infrastructure
#
# `docker-compose.yml` is the production topology (PRD 15): its four data
# services are reachable ONLY on the Compose network, because publishing
# PostgreSQL/Neo4j/MinIO/Redis on the host would be wrong for a deployment.
# That is exactly why `python run.py` on Windows cannot resolve the DNS name
# `postgres` — the name exists on the Compose network, not on the host.
#
# This file starts the same four services, with the same images, credentials,
# healthchecks and volumes, but with their ports published on the host so
# native Python (run.py, pytest, alembic, psql) can reach them:
#
#   docker compose -f docker-compose.infra.yml up -d        # start (idempotent)
#   docker compose -f docker-compose.infra.yml ps           # status
#   docker compose -f docker-compose.infra.yml logs -f postgres
#   docker compose -f docker-compose.infra.yml stop         # keep all data
#
# Nothing here is destructive: it never removes a container with `down -v`,
# never recreates a volume and never reseeds.  It shares the project name
# (`crimelink`), the `crimelink` network and the named volumes with
# docker-compose.yml, so the data you seed locally is the very same data the
# production containers use.  (If you later run the production file, Compose
# recreates the service without the published ports; the volume is untouched.)
#
# Pair it with a `.env` that asks for the real services — either the whole
# production profile:
#
#   CRIMELINK_PROFILE=production
#
# or, to run native Python against real PostgreSQL only:
#
#   CRIMELINK_RELATIONAL_BACKEND=postgres
#
# `CRIMELINK_RUNTIME_CONTEXT` stays `auto`: run.py detects "host" and rewrites
# the Compose service hostnames (`postgres`, `neo4j`, `minio`, `redis`) to
# CRIMELINK_INFRA_HOST + the published host ports below.  Inside a container the
# same `.env` keeps the service hostnames.  See backend/app/runtime.py.
#
# Bind address defaults to loopback so a development machine never exposes these
# services to the network.  Set CRIMELINK_INFRA_BIND_ADDRESS=0.0.0.0 only if you
# deliberately want that (and change every password first).

name: crimelink

services:
  # ---------------------------------------------------------------------------
  # 1. Relational store — same image, credentials and volume as production
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15.6-alpine
    container_name: crimelink-postgres
    environment:
      POSTGRES_USER: ${CRIMELINK_POSTGRES_USER:-crimelink}
      POSTGRES_PASSWORD: ${CRIMELINK_POSTGRES_PASSWORD:?CRIMELINK_POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${CRIMELINK_POSTGRES_DB:-crimelink}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - synchronous_commit=on
      - -c
      - fsync=on
      - -c
      - max_connections=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${CRIMELINK_INFRA_BIND_ADDRESS:-127.0.0.1}:${CRIMELINK_POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRIMELINK_POSTGRES_USER:-crimelink}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 2. Graph store — bolt (7687) and the browser (7474)
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26.0-community
    container_name: crimelink-neo4j
    environment:
      NEO4J_AUTH: neo4j/${CRIMELINK_NEO4J_PASSWORD:?CRIMELINK_NEO4J_PASSWORD must be set}
      NEO4J_dbms_memory_heap_max__size: ${CRIMELINK_NEO4J_HEAP:-1G}
      NEO4J_dbms_memory_pagecache_size: ${CRIMELINK_NEO4J_PAGECACHE:-512M}
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    ports:
      - "${CRIMELINK_INFRA_BIND_ADDRESS:-127.0.0.1}:${CRIMELINK_NEO4J_HOST_PORT:-7687}:7687"
      - "${CRIMELINK_INFRA_BIND_ADDRESS:-127.0.0.1}:${CRIMELINK_NEO4J_HTTP_HOST_PORT:-7474}:7474"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 3. Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2.5-alpine
    container_name: crimelink-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "${CRIMELINK_INFRA_BIND_ADDRESS:-127.0.0.1}:${CRIMELINK_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 4. Object store (write-once) — S3 API (9000) and console (9001)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: crimelink-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CRIMELINK_MINIO_ACCESS_KEY:-crimelink}
      MINIO_ROOT_PASSWORD: ${CRIMELINK_MINIO_SECRET_KEY:?CRIMELINK_MINIO_SECRET_KEY must be set}
    volumes:
      - minio-data:/data
    ports:
      - "${CRIMELINK_INFRA_BIND_ADDRESS:-127.0.0.1}:${CRIMELINK_MINIO_HOST_PORT:-9000}:9000"
      - "${CRIMELINK_INFRA_BIND_ADDRESS:-127.0.0.1}:${CRIMELINK_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [crimelink]

networks:
  crimelink:
    name: crimelink
    driver: bridge

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  minio-data:
