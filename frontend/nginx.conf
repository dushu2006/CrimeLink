# CrimeLink console — nginx configuration.
#
# The console only ever targets its own origin (/api), so the browser never
# needs to know the API's host name; nginx proxies it server-side.  This is what
# lets the same build run on a laptop, on NIC-MeghRaj, and behind a district VPN.

upstream crimelink_api {
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# WebSocket upgrade support.  For ordinary requests $connection_upgrade is
# "close" (keepalive to the upstream is handled per-location); for an upgrade
# request it echoes "upgrade", which is the only way nginx will hand the
# connection over instead of buffering it into a 200 that never arrives.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Uploads can be large (scanned case files, CSV exports).
    client_max_body_size 128m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets never change; everything else must not be cached stale,
    # because a stale console against a new API is a support incident.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Live job progress.  This must be declared before the generic /api/ block
    # and must NOT clear the Connection header: the generic block sets
    # Connection "" to keep the upstream pool alive, which silently strips the
    # upgrade handshake and is exactly why /api/v1/jobs/ws/... used to fail in
    # production while working under the Vite dev proxy.
    location /api/v1/jobs/ws {
        proxy_pass http://crimelink_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # A graph rebuild streams progress for as long as it runs; an idle
        # socket between stages must not be torn down as if it were dead.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://crimelink_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # A six-stage pipeline on a large CDR can take minutes on the first run;
        # the browser polls job status, so this only guards the export endpoint.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Prometheus scrapes from inside the cluster network only; the endpoint
    # must never be reachable from a district workstation's browser.
    location /metrics {
        proxy_pass http://crimelink_api;
        proxy_set_header Host $host;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
