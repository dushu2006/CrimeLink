# CrimeLink — Alembic configuration.
#
# The database URL is *not* stored here: it comes from ``app.config.Settings``
# (env.py) so that one source of truth drives the app, the workers and the
# migrations.  Override it for tooling with CRIMELINK_ALEMBIC_URL.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

# Revision identifiers must be sortable and human-readable.
# sqlalchemy.url is intentionally absent — see alembic/env.py.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
