[project]
name = "crimelink-backend"
version = "1.0.0"
description = "CrimeLink — AI-assisted criminal network analysis platform (backend)"
requires-python = ">=3.11"

dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "aiosqlite==0.20.0",
  "alembic==1.14.0",
  "neo4j==5.28.1",
  "networkx==3.4.2",
  "numpy==2.1.3",
  "minio==7.2.12",
  "celery[redis]==5.4.0",
  "redis==5.2.1",
  "argon2-cffi==23.1.0",
  "pyjwt==2.10.1",
  "passlib==1.7.4",
  "python-multipart==0.0.20",
  "pypdf==5.1.0",
  "python-docx==1.1.2",
  "openpyxl==3.1.5",
  "structlog==24.4.0",
  "prometheus-client==0.21.1",
  "httpx==0.28.1",
  "openai==1.59.6",
  "python-dateutil==2.9.0",
  "reportlab==4.2.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "httpx==0.28.1",
]
nlp-local = [
  "torch",
  "transformers",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
