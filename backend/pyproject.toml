[project]
name = "crimelink-backend"
version = "1.0.0"
description = "CrimeLink — AI-assisted criminal network analysis platform (backend)"
requires-python = ">=3.11"

dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "aiosqlite==0.20.0",
  "alembic==1.14.0",
  "neo4j==5.28.1",
  "networkx>=3.2,<4.0",
  # NumPy pin is kept below 2.5 on purpose: 2.5 dropped Python 3.11, while 2.4.x
  # is the newest line that still ships prebuilt wheels for the supported
  # interpreters (3.11, 3.12, 3.13) and for 3.14 where available. The old <2.3
  # cap resolved to NumPy 2.2.x, which has no Python 3.14 wheel, so pip fell
  # back to a source build and failed without a C compiler. networkx and our
  # analytics code only use the stable ndarray API, so any 1.26+ / 2.x works.
  "numpy>=1.26,<2.5",
  "minio==7.2.12",
  "celery[redis]==5.4.0",
  "redis==5.2.1",
  "argon2-cffi==23.1.0",
  "pyjwt==2.10.1",
  "passlib==1.7.4",
  "python-multipart==0.0.20",
  "pypdf==5.1.0",
  "python-docx==1.1.2",
  "openpyxl==3.1.5",
  "structlog==24.4.0",
  "prometheus-client==0.21.1",
  "httpx==0.28.1",
  "openai==1.59.6",
  "python-dateutil==2.9.0",
  "reportlab==4.2.5",
  "Faker>=24.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "httpx==0.28.1",
]
nlp-local = [
  "torch",
  "transformers",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    # The TestClient runs every request and WebSocket connection on its own
    # event loop, while the SQLAlchemy engine is a process-wide singleton that
    # dispose_engines() replaces between tests.  When an aiosqlite worker
    # thread winds down across that boundary, SQLAlchemy's asyncio pool GC
    # finalizer can emit this warning even though every session in the suite —
    # including the WebSocket authorization path — is context-manager scoped
    # and event-traced clean (connect -> checkout -> checkin -> close).  It is
    # a test-harness artifact: production runs a single loop and never disposes
    # the engine mid-flight.  Ignored by its exact wording so a genuine
    # unchecked-in connection elsewhere would still surface.
    "ignore:The garbage collector is trying to clean up non-checked-in connection:sqlalchemy.exc.SAWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
