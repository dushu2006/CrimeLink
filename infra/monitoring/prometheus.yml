# Prometheus config for CrimeLink — Priority 1.4
# Scrapes api (which exposes DB/graph/worker-derived gauges via refresh_gauges).
# Real endpoint is /api/v1/metrics (see backend/app/api/v1/health.py).
# See backend/app/services/metrics.py for metric definitions and verification.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
        # Add Alertmanager target here for real deployment, e.g.:
        # - alertmanager:9093

scrape_configs:
  - job_name: "crimelink-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/api/v1/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: "crimelink-worker"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/api/v1/metrics"
    params:
      component: ["worker"]
    # Worker metrics are exposed via API's metrics endpoint (refresh_gauges pulls DB/graph)

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Optional: add postgres, redis, neo4j exporters here when available
  # - job_name: "postgres-exporter"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]
  # - job_name: "redis-exporter"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
