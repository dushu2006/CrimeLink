# CrimeLink — production deployment topology (PRD 15)
#
# Eight containers, exactly as specified:
#
#   1. postgres  — relational system of record (PostgreSQL 15)
#   2. neo4j     — the investigation graph (Neo4j 5 Community)
#   3. redis     — Celery broker + result backend
#   4. minio     — write-once object storage for documents and audit anchors
#   5. api       — FastAPI application (uvicorn)
#   6. worker    — Celery worker for the six-stage document pipeline
#   7. beat      — Celery beat: nightly pattern detection + audit anchoring
#   8. web       — nginx: serves the React console, terminates TLS, proxies /api
#
# Everything is pinned by digest-friendly tags so the stack can be rebuilt from
# an internal mirror on NIC-MeghRaj with no registry access.
#
# Quick start:
#   cp .env.example .env      # then set CRIMELINK_SECRET_KEY and CRIMELINK_AI_API_KEY
#   docker compose up -d --build
#   Open the console and create the first administrator account.

name: crimelink

services:
  # ---------------------------------------------------------------------------
  # 1. Relational store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15.6-alpine
    container_name: crimelink-postgres
    environment:
      POSTGRES_USER: ${CRIMELINK_POSTGRES_USER:-crimelink}
      POSTGRES_PASSWORD: ${CRIMELINK_POSTGRES_PASSWORD:-crimelink}
      POSTGRES_DB: ${CRIMELINK_POSTGRES_DB:-crimelink}
      # The crash-consistency bar for an evidence system: never lose a committed
      # transaction, ever — including audit rows.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - synchronous_commit=on
      - -c
      - fsync=on
      - -c
      - max_connections=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRIMELINK_POSTGRES_USER:-crimelink}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 2. Graph store
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26.0-community
    container_name: crimelink-neo4j
    environment:
      NEO4J_AUTH: neo4j/${CRIMELINK_NEO4J_PASSWORD:-crimelink}
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
      # No outbound calls to Neo4j's telemetry endpoints: this runs on a
      # closed government network.
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 3. Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2.5-alpine
    container_name: crimelink-redis
    # No persistence: queued work is re-dispatchable from the jobs table, and a
    # lost queue entry is recoverable while a corrupt AOF file is not.
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 4. Object store (write-once)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: crimelink-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CRIMELINK_MINIO_ACCESS_KEY:-crimelink}
      MINIO_ROOT_PASSWORD: ${CRIMELINK_MINIO_SECRET_KEY:-crimelink}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [crimelink]
    # Buckets are created by the application at boot (MinioObjectStore.ensure_buckets),
    # so no sidecar initialisation container is needed.

  # ---------------------------------------------------------------------------
  # 5. API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimelink-api
    env_file: [.env]
    environment:
      CRIMELINK_PROFILE: production
      CRIMELINK_ENVIRONMENT: ${CRIMELINK_ENVIRONMENT:-production}
      CRIMELINK_POSTGRES_DSN: postgresql+asyncpg://${CRIMELINK_POSTGRES_USER:-crimelink}:${CRIMELINK_POSTGRES_PASSWORD:-crimelink}@postgres:5432/${CRIMELINK_POSTGRES_DB:-crimelink}
      CRIMELINK_POSTGRES_DSN_SYNC: postgresql+psycopg2://${CRIMELINK_POSTGRES_USER:-crimelink}:${CRIMELINK_POSTGRES_PASSWORD:-crimelink}@postgres:5432/${CRIMELINK_POSTGRES_DB:-crimelink}
      CRIMELINK_NEO4J_URI: bolt://neo4j:7687
      CRIMELINK_NEO4J_PASSWORD: ${CRIMELINK_NEO4J_PASSWORD:-crimelink}
      CRIMELINK_REDIS_URL: redis://redis:6379/0
      CRIMELINK_CELERY_BROKER_URL: redis://redis:6379/1
      CRIMELINK_CELERY_RESULT_BACKEND: redis://redis:6379/2
      CRIMELINK_MINIO_ENDPOINT: minio:9000
      CRIMELINK_CORS_ORIGINS: ${CRIMELINK_CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 6. Pipeline worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimelink-worker
    command:
      - celery
      - -A
      - app.adapters.broker.celery_app:celery_app
      - worker
      - -Q
      - pipeline,analytics,maintenance
      - --concurrency=2
      - --loglevel=INFO
      - --max-tasks-per-child=50
    env_file: [.env]
    environment:
      CRIMELINK_PROFILE: production
      CRIMELINK_ENVIRONMENT: ${CRIMELINK_ENVIRONMENT:-production}
      CRIMELINK_POSTGRES_DSN: postgresql+asyncpg://${CRIMELINK_POSTGRES_USER:-crimelink}:${CRIMELINK_POSTGRES_PASSWORD:-crimelink}@postgres:5432/${CRIMELINK_POSTGRES_DB:-crimelink}
      CRIMELINK_POSTGRES_DSN_SYNC: postgresql+psycopg2://${CRIMELINK_POSTGRES_USER:-crimelink}:${CRIMELINK_POSTGRES_PASSWORD:-crimelink}@postgres:5432/${CRIMELINK_POSTGRES_DB:-crimelink}
      CRIMELINK_NEO4J_URI: bolt://neo4j:7687
      CRIMELINK_NEO4J_PASSWORD: ${CRIMELINK_NEO4J_PASSWORD:-crimelink}
      CRIMELINK_REDIS_URL: redis://redis:6379/0
      CRIMELINK_CELERY_BROKER_URL: redis://redis:6379/1
      CRIMELINK_CELERY_RESULT_BACKEND: redis://redis:6379/2
      CRIMELINK_MINIO_ENDPOINT: minio:9000
      # The worker runs the six-stage pipeline; it never serves HTTP.
      CRIMELINK_ALLOW_STARTUP_BOOTSTRAP: "false"
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 7. Scheduler — nightly pattern detection and audit anchoring
  # ---------------------------------------------------------------------------
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimelink-beat
    command:
      - celery
      - -A
      - app.adapters.broker.celery_app:celery_app
      - beat
      - --loglevel=INFO
    env_file: [.env]
    environment:
      CRIMELINK_PROFILE: production
      CRIMELINK_POSTGRES_DSN: postgresql+asyncpg://${CRIMELINK_POSTGRES_USER:-crimelink}:${CRIMELINK_POSTGRES_PASSWORD:-crimelink}@postgres:5432/${CRIMELINK_POSTGRES_DB:-crimelink}
      CRIMELINK_POSTGRES_DSN_SYNC: postgresql+psycopg2://${CRIMELINK_POSTGRES_USER:-crimelink}:${CRIMELINK_POSTGRES_PASSWORD:-crimelink}@postgres:5432/${CRIMELINK_POSTGRES_DB:-crimelink}
      CRIMELINK_REDIS_URL: redis://redis:6379/0
      CRIMELINK_CELERY_BROKER_URL: redis://redis:6379/1
      CRIMELINK_CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 8. Console + reverse proxy
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crimelink-web
    ports:
      - "${CRIMELINK_HTTP_PORT:-80}:80"
      # Uncomment after placing certificates in ./infra/tls:
      # - "443:443"
    volumes:
      # Drop fullchain.pem / privkey.pem here to enable TLS.
      - ./infra/tls:/etc/nginx/tls:ro
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [crimelink]

networks:
  crimelink:
    name: crimelink
    driver: bridge

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  minio-data:
