# CrimeLink — production deployment topology (PRD 15)
#
# Eleven containers (8 core + 1 demo seed + 2 observability), as specified + Priority 1.4:
#
#   1. postgres  — relational system of record (PostgreSQL 15)
#   2. neo4j     — the investigation graph (Neo4j 5 Community)
#   3. redis     — Celery broker + result backend
#   4. minio     — write-once object storage for documents and audit anchors
#   5. api       — FastAPI application (uvicorn)
#   6. worker    — Celery worker for the six-stage document pipeline
#   7. beat      — Celery beat: nightly pattern detection + audit anchoring
#   8. web       — nginx: serves the React console, terminates TLS, proxies /api
#   9. seed      — production demo seed: idempotent PG/Neo4j/MinIO demo data (evaluator-ready, no manual upload)
#  10. prometheus — scrapes /api/v1/health/metrics, evaluates alert_rules.yml
#  11. grafana    — dashboards for pipeline, ER SLA, audit chain, API latency

name: crimelink

services:
  # ---------------------------------------------------------------------------
  # 1. Relational store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15.6-alpine
    container_name: crimelink-postgres
    environment:
      POSTGRES_USER: ${CRIMELINK_POSTGRES_USER:-crimelink}
      POSTGRES_PASSWORD: ${CRIMELINK_POSTGRES_PASSWORD:?CRIMELINK_POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${CRIMELINK_POSTGRES_DB:-crimelink}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - synchronous_commit=on
      - -c
      - fsync=on
      - -c
      - max_connections=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRIMELINK_POSTGRES_USER:-crimelink}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 2. Graph store
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26.0-community
    container_name: crimelink-neo4j
    environment:
      NEO4J_AUTH: neo4j/${CRIMELINK_NEO4J_PASSWORD:?CRIMELINK_NEO4J_PASSWORD must be set}
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 3. Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2.5-alpine
    container_name: crimelink-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 4. Object store (write-once)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: crimelink-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CRIMELINK_MINIO_ACCESS_KEY:-crimelink}
      MINIO_ROOT_PASSWORD: ${CRIMELINK_MINIO_SECRET_KEY:?CRIMELINK_MINIO_SECRET_KEY must be set}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 5. API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimelink-api
    env_file: [.env]
    environment:
      CRIMELINK_PROFILE: production
      CRIMELINK_ENVIRONMENT: ${CRIMELINK_ENVIRONMENT:-production}
      CRIMELINK_POSTGRES_DSN: postgresql+asyncpg://${CRIMELINK_POSTGRES_USER:-crimelink}:${CRIMELINK_POSTGRES_PASSWORD:?CRIMELINK_POSTGRES_PASSWORD must be set}@postgres:5432/${CRIMELINK_POSTGRES_DB:-crimelink}
      CRIMELINK_POSTGRES_DSN_SYNC: postgresql+psycopg2://${CRIMELINK_POSTGRES_USER:-crimelink}:${CRIMELINK_POSTGRES_PASSWORD:?CRIMELINK_POSTGRES_PASSWORD must be set}@postgres:5432/${CRIMELINK_POSTGRES_DB:-crimelink}
      CRIMELINK_NEO4J_URI: bolt://neo4j:7687
      CRIMELINK_NEO4J_PASSWORD: ${CRIMELINK_NEO4J_PASSWORD:?CRIMELINK_NEO4J_PASSWORD must be set}
      CRIMELINK_REDIS_URL: redis://redis:6379/0
      CRIMELINK_CELERY_BROKER_URL: redis://redis:6379/1
      CRIMELINK_CELERY_RESULT_BACKEND: redis://redis:6379/2
      CRIMELINK_MINIO_ENDPOINT: minio:9000
      CRIMELINK_CORS_ORIGINS: ${CRIMELINK_CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 6. Pipeline worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimelink-worker
    command:
      - celery
      - -A
      - app.adapters.broker.celery_app:celery_app
      - worker
      - -Q
      - pipeline,analytics,maintenance
      - --concurrency=2
      - --loglevel=INFO
      - --max-tasks-per-child=50
    env_file: [.env]
    environment:
      CRIMELINK_PROFILE: production
      CRIMELINK_ENVIRONMENT: ${CRIMELINK_ENVIRONMENT:-production}
      CRIMELINK_POSTGRES_DSN: postgresql+asyncpg://${CRIMELINK_POSTGRES_USER:-crimelink}:${CRIMELINK_POSTGRES_PASSWORD:?CRIMELINK_POSTGRES_PASSWORD must be set}@postgres:5432/${CRIMELINK_POSTGRES_DB:-crimelink}
      CRIMELINK_POSTGRES_DSN_SYNC: postgresql+psycopg2://${CRIMELINK_POSTGRES_USER:-crimelink}:${CRIMELINK_POSTGRES_PASSWORD:?CRIMELINK_POSTGRES_PASSWORD must be set}@postgres:5432/${CRIMELINK_POSTGRES_DB:-crimelink}
      CRIMELINK_NEO4J_URI: bolt://neo4j:7687
      CRIMELINK_NEO4J_PASSWORD: ${CRIMELINK_NEO4J_PASSWORD:?CRIMELINK_NEO4J_PASSWORD must be set}
      CRIMELINK_REDIS_URL: redis://redis:6379/0
      CRIMELINK_CELERY_BROKER_URL: redis://redis:6379/1
      CRIMELINK_CELERY_RESULT_BACKEND: redis://redis:6379/2
      CRIMELINK_MINIO_ENDPOINT: minio:9000
      CRIMELINK_ALLOW_STARTUP_BOOTSTRAP: "false"
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 7. Scheduler
  # ---------------------------------------------------------------------------
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimelink-beat
    command:
      - celery
      - -A
      - app.adapters.broker.celery_app:celery_app
      - beat
      - --loglevel=INFO
    env_file: [.env]
    environment:
      CRIMELINK_PROFILE: production
      CRIMELINK_POSTGRES_DSN: postgresql+asyncpg://${CRIMELINK_POSTGRES_USER:-crimelink}:${CRIMELINK_POSTGRES_PASSWORD:?CRIMELINK_POSTGRES_PASSWORD must be set}@postgres:5432/${CRIMELINK_POSTGRES_DB:-crimelink}
      CRIMELINK_POSTGRES_DSN_SYNC: postgresql+psycopg2://${CRIMELINK_POSTGRES_USER:-crimelink}:${CRIMELINK_POSTGRES_PASSWORD:?CRIMELINK_POSTGRES_PASSWORD must be set}@postgres:5432/${CRIMELINK_POSTGRES_DB:-crimelink}
      CRIMELINK_REDIS_URL: redis://redis:6379/0
      CRIMELINK_CELERY_BROKER_URL: redis://redis:6379/1
      CRIMELINK_CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 8. Console + reverse proxy
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crimelink-web
    ports:
      - "${CRIMELINK_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/tls:/etc/nginx/tls:ro
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 9. Production Demo Seed — Idempotent, evaluator-ready, no manual upload
  #    Populates PG (users/roles/cases/evidence metadata/source/investigation),
  #    Neo4j (people, relationships, properties), MinIO (actual files)
  #    Stable IDs: CASE-001/CR-1024 PERSON-001 E-042 INV-0001
  #    Same data scope for ADMIN/INVESTIGATOR/VIEWER, different permissions
  #    Runs after API healthy, exits 0 on success, idempotent no duplicates
  # ---------------------------------------------------------------------------
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimelink-seed
    command: ["python", "scripts/seed_demo.py"]
    env_file: [.env]
    environment:
      CRIMELINK_PROFILE: production
      CRIMELINK_ENVIRONMENT: ${CRIMELINK_ENVIRONMENT:-production}
      CRIMELINK_POSTGRES_DSN: postgresql+asyncpg://${CRIMELINK_POSTGRES_USER:-crimelink}:${CRIMELINK_POSTGRES_PASSWORD:?CRIMELINK_POSTGRES_PASSWORD must be set}@postgres:5432/${CRIMELINK_POSTGRES_DB:-crimelink}
      CRIMELINK_POSTGRES_DSN_SYNC: postgresql+psycopg2://${CRIMELINK_POSTGRES_USER:-crimelink}:${CRIMELINK_POSTGRES_PASSWORD:?CRIMELINK_POSTGRES_PASSWORD must be set}@postgres:5432/${CRIMELINK_POSTGRES_DB:-crimelink}
      CRIMELINK_NEO4J_URI: bolt://neo4j:7687
      CRIMELINK_NEO4J_PASSWORD: ${CRIMELINK_NEO4J_PASSWORD:?CRIMELINK_NEO4J_PASSWORD must be set}
      CRIMELINK_REDIS_URL: redis://redis:6379/0
      CRIMELINK_MINIO_ENDPOINT: minio:9000
    depends_on:
      api: { condition: service_healthy }
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: "no"
    networks: [crimelink]

  # ---------------------------------------------------------------------------
  # 10. Observability
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: crimelink-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${CRIMELINK_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [crimelink]

  grafana:
    image: grafana/grafana:11.2.2
    container_name: crimelink-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${CRIMELINK_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${CRIMELINK_GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_LOGIN_FORM: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/crimelink.json
    volumes:
      - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${CRIMELINK_GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    networks: [crimelink]

networks:
  crimelink:
    name: crimelink
    driver: bridge

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  minio-data:
  prometheus-data:
  grafana-data:
